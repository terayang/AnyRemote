# electron-builder configuration for AnyRemote.
# Kept as a standalone file (instead of the package.json "build" key) to keep
# package.json lean and make packaging settings reviewable on their own.
appId: com.anyremote.app
productName: AnyRemote
copyright: Copyright © 2026 Silica Yang

directories:
  output: dist

# Renderer deps (@novnc, @xterm, react, antd...) are already bundled into
# out/renderer by electron-vite; main-process deps (ssh2, ws) are copied from
# node_modules into app.asar by electron-builder (production deps default).
files:
  - out/**

asar: true

# No code signing / notarization: builds are unsigned (see docs/RELEASE.md
# for the Gatekeeper / SmartScreen user guidance this implies).
mac:
  category: public.app-category.utilities
  icon: build/icon.icns
  target:
    - target: dmg
      # Two arch-specific dmgs instead of one universal build: universal
      # packaging merges two full Electron binaries and roughly doubles the
      # dmg build time for no benefit to our per-arch users.
      arch: [arm64, x64]

dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

win:
  # electron-builder converts build/icon.png (>=256px) to .ico automatically.
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]

nsis:
  # Per-user install (no admin rights), classic wizard with directory choice.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: AnyRemote
  artifactName: ${productName}-${version}-win-${arch}.${ext}

# CI only uploads artifacts; we never publish a GitHub release from here.
publish: null

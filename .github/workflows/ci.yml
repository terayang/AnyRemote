name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # Packaging: unsigned installers (no certs in CI), artifacts only —
      # electron-builder publish is disabled (`publish: null` + --publish never).
      - name: Package macOS dmg (arm64 + x64)
        if: matrix.os == 'macos-latest'
        run: npm run dist

      - name: Package Windows NSIS installer (x64)
        if: matrix.os == 'windows-latest'
        run: npm run dist:win

      - name: Upload macOS arm64 artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: anyremote-macos-arm64
          path: dist/*arm64.dmg
          if-no-files-found: error

      - name: Upload macOS x64 artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: anyremote-macos-x64
          path: dist/*x64.dmg
          if-no-files-found: error

      - name: Upload Windows installer artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: anyremote-windows-installer
          path: dist/*win-x64.exe
          if-no-files-found: error

      - name: Upload Windows portable artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: anyremote-windows-portable
          path: dist/*portable*.exe
          if-no-files-found: error

name: CI

on:
  push:
    branches: [main, feat/wails]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      # The go embed directive (all:frontend/dist) requires dist to exist, so
      # the frontend must be built before go vet / go test can run.
      - name: Build frontend (required for go embed)
        run: npm --prefix frontend run build

      - run: npm run typecheck

      - run: npm test

      # Packaging: unsigned artifacts only (no signing certs / publish in CI).
      - name: Package macOS universal dmg
        if: matrix.os == 'macos-latest'
        run: npm run dist

      - name: Install NSIS (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install nsis -y

      - name: Package Windows NSIS installer
        if: matrix.os == 'windows-latest'
        run: npm run dist:win

      - name: Upload macOS artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: anyremote-wails-macos
          path: dist/*.dmg
          if-no-files-found: error

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: anyremote-wails-windows
          path: build/bin/*.exe
          if-no-files-found: error
